name: Agent managed CI (disabled)
run-name: ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact completed-task SHA
        required: true
        type: string
      correlation:
        description: Canonical dispatch correlation
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.ref == vars.ORCHESTRATION_CI_REF && vars.ORCHESTRATION_ACTIVATION_APPROVED == 'true' && vars.ORCHESTRATION_TEST_ISSUE == '227' && vars.ORCHESTRATION_TEST_MAX_REPAIR_TASKS == '1' }}
    name: Test ${{ inputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate SHA input
        env:
          TESTED_SHA: ${{ inputs.sha }}
        run: '[[ "$TESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify tested SHA
        env:
          TESTED_SHA: ${{ inputs.sha }}
        run: 'test "$(git rev-parse HEAD)" = "$TESTED_SHA"'
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore IntelligentTradingSimulator.sln
      - name: Build solution
        run: dotnet build IntelligentTradingSimulator.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test IntelligentTradingSimulator.sln --configuration Release --no-build --verbosity normal
