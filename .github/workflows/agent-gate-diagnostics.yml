name: Agent gate diagnostics (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report gate comparisons without running orchestration
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_ON_MASTER: ${{ github.workflow_ref == format('{0}/.github/workflows/agent-gate-diagnostics.yml@refs/heads/master', github.repository) }}
          ACTIVATION_MATCH: ${{ vars.ORCHESTRATION_ACTIVATION_APPROVED == 'true' }}
          ISSUE_MATCH: ${{ vars.ORCHESTRATION_TEST_ISSUE == '237' }}
          RETIRED_ISSUE_MATCH: ${{ vars.ORCHESTRATION_RETIRED_TEST_ISSUE == '227' }}
          REPAIR_CAP_MATCH: ${{ vars.ORCHESTRATION_TEST_MAX_REPAIR_TASKS == '1' }}
          DEFINITION_MATCH: ${{ vars.ORCHESTRATION_DEFINITION_SHA == github.sha }}
          REVIEW_POLICY_MATCH: ${{ vars.ORCHESTRATION_REVIEW_POLICY_VERIFIED == 'true' }}
          AUTOMATIC_REVIEWS_DISABLED_MATCH: ${{ vars.ORCHESTRATION_AUTOMATIC_REVIEWS_DISABLED == 'true' }}
          TRUSTED_CI_MATCH: ${{ vars.ORCHESTRATION_TRUSTED_CI_VERIFIED == 'true' }}
          CI_REF: ${{ vars.ORCHESTRATION_CI_REF }}
          CI_DEFINITION_SHA: ${{ vars.ORCHESTRATION_CI_DEFINITION_SHA }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ci_tag_target=""
          ci_tag_lookup=false
          ci_definition_match=false
          if ci_tag_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/agent-managed-ci-test-237-v1" --jq 'select(.object.type == "commit") | .object.sha' 2>/dev/null)" &&
             [[ "$ci_tag_target" =~ ^[0-9a-f]{40}$ ]]; then
            ci_tag_lookup=true
            [[ "$CI_DEFINITION_SHA" == "$ci_tag_target" ]] && ci_definition_match=true
          fi
          ci_ref_match=false
          [[ "$CI_REF" == "refs/tags/agent-managed-ci-test-237-v1" ]] && ci_ref_match=true
          {
            printf '%s\n' '## Read-only gate diagnostics' ''
            printf 'Event: `%s`\n\n' "$EVENT_NAME"
            printf 'Event ref: `%s`\n\n' "$EVENT_REF"
            printf 'Diagnostic workflow ref: `%s`\n\n' "$WORKFLOW_REF"
            printf '%s\n' '| Comparison | Match |' '| --- | --- |'
            printf '| Diagnostic workflow definition is on master | %s |\n' "$WORKFLOW_ON_MASTER"
            printf '| ORCHESTRATION_ACTIVATION_APPROVED == true | %s |\n' "$ACTIVATION_MATCH"
            printf '| ORCHESTRATION_TEST_ISSUE == 237 | %s |\n' "$ISSUE_MATCH"
            printf '| ORCHESTRATION_RETIRED_TEST_ISSUE == 227 | %s |\n' "$RETIRED_ISSUE_MATCH"
            printf '| ORCHESTRATION_TEST_MAX_REPAIR_TASKS == 1 | %s |\n' "$REPAIR_CAP_MATCH"
            printf '| ORCHESTRATION_DEFINITION_SHA == this run SHA | %s |\n' "$DEFINITION_MATCH"
            printf '| ORCHESTRATION_REVIEW_POLICY_VERIFIED == true | %s |\n' "$REVIEW_POLICY_MATCH"
            printf '| ORCHESTRATION_AUTOMATIC_REVIEWS_DISABLED == true | %s |\n' "$AUTOMATIC_REVIEWS_DISABLED_MATCH"
            printf '| ORCHESTRATION_TRUSTED_CI_VERIFIED == true | %s |\n' "$TRUSTED_CI_MATCH"
            printf '| ORCHESTRATION_CI_REF == refs/tags/agent-managed-ci-test-237-v1 | %s |\n' "$ci_ref_match"
            printf '| New CI tag resolves to a commit | %s |\n' "$ci_tag_lookup"
            printf '| ORCHESTRATION_CI_DEFINITION_SHA matches the new tag target | %s |\n' "$ci_definition_match"
            printf '\n%s\n' \
              'These comparisons use repository/organization variables, without an environment.' \
              'This is a manual diagnostic run, not the context or variable snapshot of an earlier Issue event.' \
              'A false comparison is diagnostic output; a successful job does not approve activation.' \
              'The CI tag lookup uses contents:read only; its protection must be verified separately.' \
              'Keep live workflows disabled and activation false while diagnosing. No task, CI, or state write was requested.'
          } | tee "$GITHUB_STEP_SUMMARY"
