name: Isolated exact-head CI (disabled by default)
run-name: ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact completed-task head SHA
        required: true
        type: string
      correlation:
        description: Canonical dispatch correlation
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/') &&
        github.ref == vars.ORCHESTRATION_STATUS_TEST_CI_REF &&
        github.workflow_sha == vars.ORCHESTRATION_STATUS_TEST_CI_DEFINITION_SHA &&
        github.actor == 'github-actions[bot]' &&
        startsWith(inputs.correlation, 'managed-ci-') &&
        vars.ORCHESTRATION_STATUS_TEST_APPROVED == 'true' &&
        vars.ORCHESTRATION_STATUS_TEST_STATE_REF == 'refs/heads/agent-state-status-revocation-v1' &&
        vars.ORCHESTRATION_STATUS_TEST_BASE_BRANCH == 'agent-status-revocation-base-v1'
      }}
    name: Test ${{ inputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate SHA input
        env:
          TESTED_SHA: ${{ inputs.sha }}
        run: '[[ "$TESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify tested SHA
        env:
          TESTED_SHA: ${{ inputs.sha }}
        run: 'test "$(git rev-parse HEAD)" = "$TESTED_SHA"'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore IntelligentTradingSimulator.sln
      - name: Build solution
        run: dotnet build IntelligentTradingSimulator.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test IntelligentTradingSimulator.sln --configuration Release --no-build --verbosity normal
