name: One-shot Copilot review API probe (test branch only)

on:
  workflow_dispatch:
    inputs:
      pull:
        description: Dedicated draft test PR number
        required: true
        type: string
      confirmation:
        description: Type ONE-COPILOT-REVIEW-NO-CODING-NO-MERGE
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: poc-review-api-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      ${{
        github.repository == 'ExarKun1983/IntelligentTradingSimulator' &&
        github.ref == 'refs/heads/copilot/poc-review-api-probe' &&
        github.actor_id == '6195946' &&
        github.triggering_actor == github.actor &&
        github.run_attempt == 1 &&
        inputs.confirmation == 'ONE-COPILOT-REVIEW-NO-CODING-NO-MERGE'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request one review using only the workflow token
        env:
          WORKFLOW_TOKEN: ${{ github.token }}
          TEST_PULL: ${{ inputs.pull }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request(path, data=None):
              req = urllib.request.Request(
                  "https://api.github.com/" + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={
                      "Authorization": "Bearer " + os.environ["WORKFLOW_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
                  method="GET" if data is None else "POST",
              )
              try:
                  with urllib.request.build_opener(NoRedirect).open(req, timeout=30) as response:
                      result = json.load(response)
                      print("GitHub API HTTP", response.status)
                      return result
              except urllib.error.HTTPError as error:
                  raise SystemExit("GitHub API HTTP " + str(error.code) + "; no retry.") from None
              except urllib.error.URLError:
                  raise SystemExit("GitHub API transport failure; outcome may be uncertain; no retry.") from None

          pull = os.environ["TEST_PULL"]
          if re.fullmatch("[1-9][0-9]*", pull) is None:
              raise SystemExit("Invalid test PR number.")
          repository = "ExarKun1983/IntelligentTradingSimulator"
          path = "repos/" + repository + "/pulls/" + pull
          pr = request(path)
          if not (
              pr["state"] == "open" and pr["draft"] is True
              and pr["head"]["repo"]["full_name"] == repository
              and pr["base"]["repo"]["full_name"] == repository
              and pr["head"]["ref"] == "copilot/poc-review-api-probe"
              and pr["head"]["sha"] == os.environ["GITHUB_SHA"]
              and pr["base"]["ref"] == "master"
              and pr["user"]["id"] == 6195946
          ):
              raise SystemExit("PR is not the expected exact-head draft test fixture.")
          for endpoint in ("requested_reviewers", "reviews"):
              value = request(path + "/" + endpoint + "?per_page=100&page=1")
              entries = value["users"] + value["teams"] if endpoint == "requested_reviewers" else value
              if entries:
                  raise SystemExit("Existing reviewers or reviews; refusing another request.")
          reviewer = "copilot-pull-request-reviewer[bot]"
          result = request(path + "/requested_reviewers", {"reviewers": [reviewer]})
          accepted = any(user.get("login") in (reviewer, "Copilot")
                         for user in result.get("requested_reviewers", []))
          summary = (
              "One review POST was sent using GITHUB_TOKEN; no retries.\n"
              "Copilot appears in the response: " + str(accepted).lower() + "\n"
              "No user secret, coding task, state write or merge was used.\n"
              "This verifies this probe token only, not a future driver token or cost policy.\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          if not accepted:
              raise SystemExit("Request response did not confirm Copilot; inspect before any further action.")
