name: Isolated status test diagnostics (no mutations)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  diagnose:
    if: >-
      ${{
        github.repository == 'ExarKun1983/IntelligentTradingSimulator' &&
        github.workflow_ref == format('{0}/.github/workflows/agent-status-test-diagnostics.yml@refs/heads/master', github.repository) &&
        github.actor_id == '6195946' &&
        vars.ORCHESTRATION_STATUS_TEST_APPROVED == 'false' &&
        vars.ORCHESTRATION_STATUS_TEST_BOOTSTRAP_APPROVED == 'false' &&
        vars.ORCHESTRATION_STATUS_TEST_STATUS_PUBLISHER_VERIFIED == 'false'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read publisher identity and isolated definition pins
        env:
          WORKFLOW_TOKEN: ${{ github.token }}
          ISSUE: ${{ vars.ORCHESTRATION_STATUS_TEST_ISSUE }}
          ACTOR_ID: ${{ vars.ORCHESTRATION_STATUS_TEST_ACTOR_ID }}
          DRIVER_ID: ${{ vars.ORCHESTRATION_STATUS_TEST_WORKFLOW_ID }}
          CI_ID: ${{ vars.ORCHESTRATION_STATUS_TEST_CI_WORKFLOW_ID }}
          DRIVER_SHA: ${{ vars.ORCHESTRATION_STATUS_TEST_DEFINITION_SHA }}
          CI_SHA: ${{ vars.ORCHESTRATION_STATUS_TEST_CI_DEFINITION_SHA }}
          DRIVER_REF: ${{ vars.ORCHESTRATION_STATUS_TEST_DRIVER_REF }}
          CI_REF: ${{ vars.ORCHESTRATION_STATUS_TEST_CI_REF }}
          STATE_REF: ${{ vars.ORCHESTRATION_STATUS_TEST_STATE_REF }}
          BASE_BRANCH: ${{ vars.ORCHESTRATION_STATUS_TEST_BASE_BRANCH }}
          TEST_ENVIRONMENT: ${{ vars.ORCHESTRATION_STATUS_TEST_ENVIRONMENT }}
          EXPIRES_AT: ${{ vars.ORCHESTRATION_STATUS_TEST_EXPIRES_AT }}
        shell: python
        run: |
          import datetime
          import http.client
          import json
          import os
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def read(path, query=None):
              request = urllib.request.Request(
                  "https://api.github.com/" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["WORKFLOW_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2026-03-10",
                      "User-Agent": "IntelligentTradingSimulator-StatusDiagnostics",
                  },
                  data=None if query is None else json.dumps({"query": query}).encode(),
                  method="GET" if query is None else "POST",
              )
              try:
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                      payload = response.read(2 * 1024 * 1024 + 1)
              except urllib.error.HTTPError as error:
                  raise SystemExit("Diagnostic read failed; HTTP status " + str(error.code)) from None
              except (urllib.error.URLError, OSError, http.client.HTTPException):
                  raise SystemExit("Diagnostic read failed; transport error.") from None
              if len(payload) > 2 * 1024 * 1024:
                  raise SystemExit("Diagnostic response exceeds capacity.")
              try:
                  result = json.loads(payload)
              except (ValueError, UnicodeError):
                  raise SystemExit("Diagnostic response is not valid JSON.") from None
              if not isinstance(result, dict):
                  raise SystemExit("Diagnostic response is not an object.")
              return result

          if not os.environ["WORKFLOW_TOKEN"]:
              raise SystemExit("Workflow credential is missing.")
          repository = "repos/ExarKun1983/IntelligentTradingSimulator"
          identity = read("graphql", "query { viewer { login databaseId id } }")
          if identity.get("errors", []) != []:
              raise SystemExit("Publisher identity query returned errors.")
          data = identity.get("data")
          if not isinstance(data, dict) or not isinstance(data.get("viewer"), dict):
              raise SystemExit("Publisher identity response is incomplete.")
          viewer = data["viewer"]
          bot = read("users/github-actions%5Bbot%5D")
          repo = read(repository)
          tag = read(repository + "/git/ref/tags/agent-status-revocation-definition-v1")
          if not isinstance(tag.get("object"), dict):
              raise SystemExit("Definition tag response is incomplete.")
          driver = read(repository + "/actions/workflows/414090147")
          ci = read(repository + "/actions/workflows/414090145")
          try:
              expiration = datetime.datetime.fromisoformat(os.environ["EXPIRES_AT"].replace("Z", "+00:00"))
              now = datetime.datetime.now(datetime.timezone.utc)
              valid_expiration = now < expiration <= now + datetime.timedelta(hours=72)
          except (ValueError, TypeError):
              valid_expiration = False

          expected_sha = "b3df1399a222d695f80c71f97c01b2d2b10f378a"
          expected_ref = "refs/tags/agent-status-revocation-definition-v1"
          checks = {
              "publisher_identity": (
                  viewer.get("login") == bot.get("login") == "github-actions[bot]"
                  and viewer.get("databaseId") == bot.get("id") == 41898282
                  and bot.get("type") == "Bot"
                  and isinstance(bot.get("node_id"), str) and bool(bot["node_id"])
                  and viewer.get("id") == bot["node_id"]
              ),
              "repository_identity": repo.get("id") == 1277929203,
              "issue_and_actor_configuration": os.environ["ISSUE"] == "242" and os.environ["ACTOR_ID"] == "6195946",
              "driver_definition": (
                  os.environ["DRIVER_ID"] == "414090147" and driver.get("id") == 414090147
                  and driver.get("path") == ".github/workflows/agent-status-revocation-test.yml"
                  and driver.get("state") == "active"
              ),
              "ci_definition": (
                  os.environ["CI_ID"] == "414090145" and ci.get("id") == 414090145
                  and ci.get("path") == ".github/workflows/agent-status-revocation-ci.yml"
                  and ci.get("state") == "active"
              ),
              "shared_tag_and_sha": (
                  os.environ["DRIVER_REF"] == os.environ["CI_REF"] == tag.get("ref") == expected_ref
                  and os.environ["DRIVER_SHA"] == os.environ["CI_SHA"] == expected_sha
                  and tag["object"].get("type") == "commit"
                  and tag["object"].get("sha") == expected_sha
              ),
              "isolated_resources_configuration": (
                  os.environ["STATE_REF"] == "refs/heads/agent-state-status-revocation-v1"
                  and os.environ["BASE_BRANCH"] == "agent-status-revocation-base-v1"
                  and os.environ["TEST_ENVIRONMENT"] == "agent-status-revocation-test"
              ),
              "authorization_window": valid_expiration,
          }
          report = [
              "## Isolated status test diagnostics", "",
              "| Check | Match |", "| --- | --- |",
              *["| " + name + " | " + str(value).lower() + " |" for name, value in checks.items()],
              "",
              "No AI task, CI dispatch, status publication, state write or configuration change was requested.",
              "This job requests statuses: write only to inspect the effective grant in its Set up job log.",
              "Identity checks do not prove status-write access. Inspect GITHUB_TOKEN Permissions in that log.",
              "This token belongs to this diagnostic run, not to a future driver run.",
              "No environment or user secret was accessed; user-token identity/entitlement remains unverified here.",
              "Protected resources and cost controls require separate operator verification.",
              "A green diagnostic does not authorize bootstrap or the live test; keep both approval flags false.",
          ]
          summary = "\n".join(report) + "\n"
          print(summary, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          if not all(checks.values()):
              raise SystemExit("One or more isolated diagnostic checks failed.")
