name: Agent orchestrator

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-orchestrator.yml
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [labeled, closed]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: agent-orchestrator-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

env:
  READY_LABEL: agent:ready
  WORKING_LABEL: agent:working
  REVIEW_LABEL: agent:review
  BLOCKED_LABEL: agent:blocked
  BASE_BRANCH: master

jobs:
  bootstrap-labels:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$READY_LABEL" --repo "$REPOSITORY" --color 0E8A16 --description "Ready to be delegated to Copilot cloud agent" --force
          gh label create "$WORKING_LABEL" --repo "$REPOSITORY" --color FBCA04 --description "Copilot cloud agent is implementing this issue" --force
          gh label create "$REVIEW_LABEL" --repo "$REPOSITORY" --color 1D76DB --description "A linked pull request is ready for human review" --force
          gh label create "$BLOCKED_LABEL" --repo "$REPOSITORY" --color D93F0B --description "Automation stopped and needs human attention" --force

  start-agent:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent:ready' &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Move issue to working
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$READY_LABEL" --add-label "$WORKING_LABEL"

      - name: Start Copilot cloud agent task
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          test -n "${COPILOT_AGENT_TOKEN:-}" || { echo "Missing COPILOT_AGENT_TOKEN" >&2; exit 1; }
          payload="$(jq -n \
            --arg n "$ISSUE_NUMBER" \
            --arg title "$ISSUE_TITLE" \
            --arg body "$ISSUE_BODY" \
            --arg base "$BASE_BRANCH" \
            '{prompt:("Implement GitHub Issue #"+$n+": "+$title+"\n\n"+$body+"\n\nFollow .github/copilot-instructions.md. Keep changes focused. Run restore, build, and tests. Create a pull request against "+$base+". The pull request body must include a standalone line: Closes #"+$n+". Do not merge the pull request."),base_ref:$base,create_pull_request:true}')"
          response="$(mktemp)"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header "Authorization: Bearer $COPILOT_AGENT_TOKEN" \
            "https://api.github.com/agents/repos/$REPOSITORY/tasks" \
            --data "$payload")"
          cat "$response"
          [[ "$code" == 2* ]] || { echo "Agent API returned HTTP $code" >&2; exit 1; }

      - name: Mark blocked if delegation failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$WORKING_LABEL" --add-label "$BLOCKED_LABEL"

  promote-after-ci:
    name: Promote successful Copilot PR to review
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mark successful draft Copilot PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # The orchestrator only owns Copilot branches created by this workflow.
          [[ "$HEAD_BRANCH" == copilot/* ]] || { echo "Not a Copilot branch: $HEAD_BRANCH"; exit 0; }

          pr="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --limit 1 \
            --json number,isDraft,headRefName,url \
            | jq -c '.[0] // empty')"
          [ -n "$pr" ] || { echo "No open PR for $HEAD_BRANCH"; exit 0; }

          pr_number="$(jq -r '.number' <<< "$pr")"
          is_draft="$(jq -r '.isDraft' <<< "$pr")"

          if [ "$is_draft" = "true" ]; then
            gh pr ready "$pr_number" --repo "$REPOSITORY"
          fi

          # Update any open issue that GitHub links to the PR.
          issues="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number')"
          while IFS= read -r issue_number; do
            [ -z "$issue_number" ] && continue
            labels="$(gh issue view "$issue_number" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
            for label in "$READY_LABEL" "$WORKING_LABEL" "$BLOCKED_LABEL"; do
              if grep -Fxq "$label" <<< "$labels"; then
                gh issue edit "$issue_number" --repo "$REPOSITORY" --remove-label "$label"
              fi
            done
            if ! grep -Fxq "$REVIEW_LABEL" <<< "$labels"; then
              gh issue edit "$issue_number" --repo "$REPOSITORY" --add-label "$REVIEW_LABEL"
            fi
          done <<< "$issues"

  reconcile-pr-event:
    name: Synchronize issue from pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          issues="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')"
          while IFS= read -r issue_number; do
            [ -z "$issue_number" ] && continue
            labels="$(gh issue view "$issue_number" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
            for label in "$READY_LABEL" "$WORKING_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
              if grep -Fxq "$label" <<< "$labels"; then
                gh issue edit "$issue_number" --repo "$REPOSITORY" --remove-label "$label"
              fi
            done

            if [ "$PR_MERGED" = "true" ]; then
              gh issue close "$issue_number" --repo "$REPOSITORY" --reason completed || true
            elif [ "$PR_ACTION" = "closed" ]; then
              gh issue edit "$issue_number" --repo "$REPOSITORY" --add-label "$BLOCKED_LABEL"
            elif [ "$PR_DRAFT" = "false" ]; then
              gh issue edit "$issue_number" --repo "$REPOSITORY" --add-label "$REVIEW_LABEL"
            else
              gh issue edit "$issue_number" --repo "$REPOSITORY" --add-label "$WORKING_LABEL"
            fi
          done <<< "$issues"

  cleanup-closed-issue:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove agent labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          labels="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          for label in "$READY_LABEL" "$WORKING_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
            if grep -Fxq "$label" <<< "$labels"; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$label"
            fi
          done
