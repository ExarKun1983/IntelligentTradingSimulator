name: Agent orchestrator v5.2.5

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/agent-orchestrator.yml]
  issues:
    types: [labeled, closed]
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-orchestrator-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.event.issue.number || github.ref }}
  cancel-in-progress: false

env:
  READY_LABEL: agent:ready
  WORKING_LABEL: agent:working
  AI_REVIEW_LABEL: agent:ai-review
  REVIEW_LABEL: agent:review
  BLOCKED_LABEL: agent:blocked
  BASE_BRANCH: master
  COPILOT_REVIEWER: copilot-pull-request-reviewer[bot]
  MAX_FIX_ROUNDS: 3
  REVIEW_WAIT_SECONDS: 900
  POLL_SECONDS: 30

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$READY_LABEL" --repo "$REPO" --color 0E8A16 --description "Ready for Copilot" --force
          gh label create "$WORKING_LABEL" --repo "$REPO" --color FBCA04 --description "Copilot is implementing or fixing feedback" --force
          gh label create "$AI_REVIEW_LABEL" --repo "$REPO" --color 5319E7 --description "Waiting for Copilot code review" --force
          gh label create "$REVIEW_LABEL" --repo "$REPO" --color 1D76DB --description "Ready for human review" --force
          gh label create "$BLOCKED_LABEL" --repo "$REPO" --color D93F0B --description "Needs human attention" --force

  start-agent:
    if: >-
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'agent:ready' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Validate and start task
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          active="$(gh issue list --repo "$REPO" --state open --limit 200 --json number,labels)"
          count="$(jq --argjson issue "$ISSUE" --arg w "$WORKING_LABEL" --arg a "$AI_REVIEW_LABEL" --arg r "$REVIEW_LABEL" \
            '[.[] | select(.number != $issue) | select(any(.labels[]?.name; . == $w or . == $a or . == $r))] | length' <<< "$active")"
          if [ "$count" -ne 0 ]; then
            echo "Another Issue is active; finish or unblock it first." >&2
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$READY_LABEL" --add-label "$BLOCKED_LABEL"
            exit 1
          fi
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$READY_LABEL" --add-label "$WORKING_LABEL"
          payload="$(jq -n --arg n "$ISSUE" --arg t "$TITLE" --arg b "$BODY" --arg base "$BASE_BRANCH" \
            '{prompt: ("Implement GitHub Issue #" + $n + ": " + $t + "\n\n" + $b + "\n\nRun restore, build, and all tests. Create a pull request against " + $base + ". Include the line `Closes #" + $n + "` in the PR description. Do not merge."), base_ref: $base, create_pull_request: true}')"
          out="$(mktemp)"
          code="$(curl -sS -o "$out" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer $AGENT_TOKEN" \
            "https://api.github.com/agents/repos/$REPO/tasks" -d "$payload")"
          cat "$out"
          if [[ "$code" != 2* ]]; then
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$WORKING_LABEL" --add-label "$BLOCKED_LABEL"
            exit 1
          fi

  map-pr:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'opened' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Persist Issue to PR mapping
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          resolve_issue() {
            # Order: PR body marker -> branch name -> Issue comment -> single active Issue.
            local pr="$1" branch="$2" body issue open_json candidate comments active
            body="$(gh pr view "$pr" --repo "$REPO" --json body --jq '.body // ""')"
            issue="$(printf '%s\n' "$body" | sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' | head -1)"
            if [ -z "$issue" ]; then
              issue="$(printf '%s\n' "$branch" | sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p')"
            fi
            open_json="$(gh issue list --repo "$REPO" --state open --limit 200 --json number,labels)"
            if [ -z "$issue" ]; then
              for candidate in $(jq -r --arg w "$WORKING_LABEL" --arg a "$AI_REVIEW_LABEL" --arg r "$REVIEW_LABEL" --arg b "$BLOCKED_LABEL" \
                  '.[] | select(any(.labels[]?.name; . == $w or . == $a or . == $r or . == $b)) | .number' <<< "$open_json"); do
                comments="$(gh issue view "$candidate" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
                if printf '%s\n' "$comments" | grep -Eq "agent-orchestrator:pr=${pr}([^0-9]|$)|Mapped automatically to PR #${pr}([^0-9]|$)"; then
                  issue="$candidate"; break
                fi
              done
            fi
            if [ -z "$issue" ]; then
              active="$(jq -r --arg w "$WORKING_LABEL" --arg a "$AI_REVIEW_LABEL" --arg r "$REVIEW_LABEL" \
                  '[.[] | select(any(.labels[]?.name; . == $w or . == $a or . == $r)) | .number] | if length == 1 then .[0] else empty end' <<< "$open_json")"
              if [ -n "$active" ]; then echo "Mapped PR #$pr to the only active Issue #$active" >&2; issue="$active"; fi
            fi
            if [ -n "$issue" ]; then
              if ! printf '%s\n' "$body" | grep -Fq "agent-orchestrator:issue=$issue"; then
                gh pr edit "$pr" --repo "$REPO" --body "$(printf '%s\n\n<!-- agent-orchestrator:issue=%s -->\nCloses #%s\n' "$body" "$issue" "$issue")" >/dev/null
              fi
              comments="$(gh issue view "$issue" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
              if ! printf '%s\n' "$comments" | grep -Eq "agent-orchestrator:pr=${pr}([^0-9]|$)"; then
                gh issue comment "$issue" --repo "$REPO" --body "$(printf '<!-- agent-orchestrator:pr=%s -->\nMapped automatically to PR #%s.' "$pr" "$pr")" >/dev/null
              fi
            fi
            printf '%s' "$issue"
          }

          set_state() {
            local issue="$1" target="$2" labels label
            labels="$(gh issue view "$issue" --repo "$REPO" --json labels --jq '.labels[]?.name // empty')"
            for label in "$READY_LABEL" "$WORKING_LABEL" "$AI_REVIEW_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
              if [ "$label" != "$target" ] && printf '%s\n' "$labels" | grep -Fxq "$label"; then
                gh issue edit "$issue" --repo "$REPO" --remove-label "$label" >/dev/null
              fi
            done
            if [ -n "$target" ] && ! printf '%s\n' "$labels" | grep -Fxq "$target"; then
              gh issue edit "$issue" --repo "$REPO" --add-label "$target" >/dev/null
            fi
          }

          copilot_reviewed() {
            local reviews
            reviews="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/pulls/$1/reviews")"
            jq -e --arg sha "$2" 'any(.[]?; (.user.login | startswith("copilot-pull-request-reviewer")) and .commit_id == $sha)' <<< "$reviews" >/dev/null
          }

          request_copilot_review() {
            local pr="$1" sha="$2" requested
            if copilot_reviewed "$pr" "$sha"; then echo "Copilot already reviewed $sha"; return 0; fi
            requested="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/pulls/$pr/requested_reviewers")"
            if jq -e 'any(.users[]?; .login | startswith("copilot-pull-request-reviewer"))' <<< "$requested" >/dev/null; then
              echo "Copilot review already pending"; return 0
            fi
            gh api --silent --method POST -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/pulls/$pr/requested_reviewers" -f "reviewers[]=$COPILOT_REVIEWER"
            echo "Copilot review requested for PR #$pr"
          }

          wait_for_review() {
            # 0 = review for sha exists, 1 = timeout, 2 = PR head moved on (newer commit will be handled by its own CI run)
            local pr="$1" sha="$2" deadline head
            deadline=$(( $(date +%s) + REVIEW_WAIT_SECONDS ))
            while :; do
              if copilot_reviewed "$pr" "$sha"; then echo "Copilot review for $sha is available"; return 0; fi
              head="$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
              if [ "$head" != "$sha" ]; then echo "PR head moved to $head; leaving it to the next CI run"; return 2; fi
              if [ "$(date +%s)" -ge "$deadline" ]; then echo "Copilot review did not arrive in time"; return 1; fi
              sleep "$POLL_SECONDS"
            done
          }

          process_review() {
            # Decide after Copilot reviewed the current head: hand findings to the coding agent, or promote to human review.
            local pr="$1" issue="$2" sha="$3" threads open_threads count findings marker existing rounds
            threads="$(gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:20){nodes{body path line author{login}}}}}}}}' \
              -F owner="${REPO%%/*}" -F repo="${REPO#*/}" -F number="$pr")"
            open_threads='[.data.repository.pullRequest.reviewThreads.nodes[]? | select(.isResolved == false) | select(any(.comments.nodes[]?; .author.login | startswith("copilot-pull-request-reviewer")))]'
            count="$(jq "$open_threads | length" <<< "$threads")"
            if [ "$count" -eq 0 ]; then
              echo "No unresolved Copilot findings; CI is green -> human review"
              gh pr ready "$pr" --repo "$REPO" >/dev/null 2>&1 || true
              set_state "$issue" "$REVIEW_LABEL"
              return 0
            fi
            existing="$(gh pr view "$pr" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
            marker="<!-- agent-orchestrator:handoff-sha=$sha -->"
            if printf '%s\n' "$existing" | grep -Fq "$marker"; then
              echo "Findings for $sha already handed off"; set_state "$issue" "$WORKING_LABEL"; return 0
            fi
            rounds="$(printf '%s\n' "$existing" | grep -c 'agent-orchestrator:handoff-sha=' || true)"
            if [ "$rounds" -ge "$MAX_FIX_ROUNDS" ]; then
              gh pr comment "$pr" --repo "$REPO" --body "Agent orchestrator stopped after $rounds automatic fix rounds. $count Copilot finding(s) remain unresolved and need a human decision." >/dev/null
              set_state "$issue" "$BLOCKED_LABEL"
              return 0
            fi
            findings="$(jq -r "$open_threads | map(.comments.nodes[0] | \"- \(.path // \"general\"):\(.line // \"\") \(.body)\") | join(\"\n\")" <<< "$threads")"
            gh pr comment "$pr" --repo "$REPO" --body "$(printf '%s\n\n%s\n\n%s' \
              '@copilot Please address all unresolved Copilot code review findings below on this PR branch. Update tests and documentation as needed, run all tests, push the fix, and resolve the addressed threads. Do not merge.' \
              "$findings" "$marker")" >/dev/null
            echo "Handed off $count finding(s) to Copilot (round $((rounds + 1)) of $MAX_FIX_ROUNDS)"
            set_state "$issue" "$WORKING_LABEL"
          }
          issue="$(resolve_issue "$PR" "$BRANCH")"
          if [ -z "$issue" ]; then echo "Could not map PR #$PR to an Issue" >&2; exit 1; fi
          echo "PR #$PR mapped to Issue #$issue"

  review-after-ci:
    # After green CI: request Copilot review, wait for it in this job, then hand off findings or promote.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'copilot/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Request review, wait, process
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          resolve_issue() {
            # Order: PR body marker -> branch name -> Issue comment -> single active Issue.
            local pr="$1" branch="$2" body issue open_json candidate comments active
            body="$(gh pr view "$pr" --repo "$REPO" --json body --jq '.body // ""')"
            issue="$(printf '%s\n' "$body" | sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' | head -1)"
            if [ -z "$issue" ]; then
              issue="$(printf '%s\n' "$branch" | sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p')"
            fi
            open_json="$(gh issue list --repo "$REPO" --state open --limit 200 --json number,labels)"
            if [ -z "$issue" ]; then
              for candidate in $(jq -r --arg w "$WORKING_LABEL" --arg a "$AI_REVIEW_LABEL" --arg r "$REVIEW_LABEL" --arg b "$BLOCKED_LABEL" \
                  '.[] | select(any(.labels[]?.name; . == $w or . == $a or . == $r or . == $b)) | .number' <<< "$open_json"); do
                comments="$(gh issue view "$candidate" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
                if printf '%s\n' "$comments" | grep -Eq "agent-orchestrator:pr=${pr}([^0-9]|$)|Mapped automatically to PR #${pr}([^0-9]|$)"; then
                  issue="$candidate"; break
                fi
              done
            fi
            if [ -z "$issue" ]; then
              active="$(jq -r --arg w "$WORKING_LABEL" --arg a "$AI_REVIEW_LABEL" --arg r "$REVIEW_LABEL" \
                  '[.[] | select(any(.labels[]?.name; . == $w or . == $a or . == $r)) | .number] | if length == 1 then .[0] else empty end' <<< "$open_json")"
              if [ -n "$active" ]; then echo "Mapped PR #$pr to the only active Issue #$active" >&2; issue="$active"; fi
            fi
            if [ -n "$issue" ]; then
              if ! printf '%s\n' "$body" | grep -Fq "agent-orchestrator:issue=$issue"; then
                gh pr edit "$pr" --repo "$REPO" --body "$(printf '%s\n\n<!-- agent-orchestrator:issue=%s -->\nCloses #%s\n' "$body" "$issue" "$issue")" >/dev/null
              fi
              comments="$(gh issue view "$issue" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
              if ! printf '%s\n' "$comments" | grep -Eq "agent-orchestrator:pr=${pr}([^0-9]|$)"; then
                gh issue comment "$issue" --repo "$REPO" --body "$(printf '<!-- agent-orchestrator:pr=%s -->\nMapped automatically to PR #%s.' "$pr" "$pr")" >/dev/null
              fi
            fi
            printf '%s' "$issue"
          }

          set_state() {
            local issue="$1" target="$2" labels label
            labels="$(gh issue view "$issue" --repo "$REPO" --json labels --jq '.labels[]?.name // empty')"
            for label in "$READY_LABEL" "$WORKING_LABEL" "$AI_REVIEW_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
              if [ "$label" != "$target" ] && printf '%s\n' "$labels" | grep -Fxq "$label"; then
                gh issue edit "$issue" --repo "$REPO" --remove-label "$label" >/dev/null
              fi
            done
            if [ -n "$target" ] && ! printf '%s\n' "$labels" | grep -Fxq "$target"; then
              gh issue edit "$issue" --repo "$REPO" --add-label "$target" >/dev/null
            fi
          }

          copilot_reviewed() {
            local reviews
            reviews="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/pulls/$1/reviews")"
            jq -e --arg sha "$2" 'any(.[]?; (.user.login | startswith("copilot-pull-request-reviewer")) and .commit_id == $sha)' <<< "$reviews" >/dev/null
          }

          request_copilot_review() {
            local pr="$1" sha="$2" requested
            if copilot_reviewed "$pr" "$sha"; then echo "Copilot already reviewed $sha"; return 0; fi
            requested="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/pulls/$pr/requested_reviewers")"
            if jq -e 'any(.users[]?; .login | startswith("copilot-pull-request-reviewer"))' <<< "$requested" >/dev/null; then
              echo "Copilot review already pending"; return 0
            fi
            gh api --silent --method POST -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/pulls/$pr/requested_reviewers" -f "reviewers[]=$COPILOT_REVIEWER"
            echo "Copilot review requested for PR #$pr"
          }

          wait_for_review() {
            # 0 = review for sha exists, 1 = timeout, 2 = PR head moved on (newer commit will be handled by its own CI run)
            local pr="$1" sha="$2" deadline head
            deadline=$(( $(date +%s) + REVIEW_WAIT_SECONDS ))
            while :; do
              if copilot_reviewed "$pr" "$sha"; then echo "Copilot review for $sha is available"; return 0; fi
              head="$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
              if [ "$head" != "$sha" ]; then echo "PR head moved to $head; leaving it to the next CI run"; return 2; fi
              if [ "$(date +%s)" -ge "$deadline" ]; then echo "Copilot review did not arrive in time"; return 1; fi
              sleep "$POLL_SECONDS"
            done
          }

          process_review() {
            # Decide after Copilot reviewed the current head: hand findings to the coding agent, or promote to human review.
            local pr="$1" issue="$2" sha="$3" threads open_threads count findings marker existing rounds
            threads="$(gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:20){nodes{body path line author{login}}}}}}}}' \
              -F owner="${REPO%%/*}" -F repo="${REPO#*/}" -F number="$pr")"
            open_threads='[.data.repository.pullRequest.reviewThreads.nodes[]? | select(.isResolved == false) | select(any(.comments.nodes[]?; .author.login | startswith("copilot-pull-request-reviewer")))]'
            count="$(jq "$open_threads | length" <<< "$threads")"
            if [ "$count" -eq 0 ]; then
              echo "No unresolved Copilot findings; CI is green -> human review"
              gh pr ready "$pr" --repo "$REPO" >/dev/null 2>&1 || true
              set_state "$issue" "$REVIEW_LABEL"
              return 0
            fi
            existing="$(gh pr view "$pr" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
            marker="<!-- agent-orchestrator:handoff-sha=$sha -->"
            if printf '%s\n' "$existing" | grep -Fq "$marker"; then
              echo "Findings for $sha already handed off"; set_state "$issue" "$WORKING_LABEL"; return 0
            fi
            rounds="$(printf '%s\n' "$existing" | grep -c 'agent-orchestrator:handoff-sha=' || true)"
            if [ "$rounds" -ge "$MAX_FIX_ROUNDS" ]; then
              gh pr comment "$pr" --repo "$REPO" --body "Agent orchestrator stopped after $rounds automatic fix rounds. $count Copilot finding(s) remain unresolved and need a human decision." >/dev/null
              set_state "$issue" "$BLOCKED_LABEL"
              return 0
            fi
            findings="$(jq -r "$open_threads | map(.comments.nodes[0] | \"- \(.path // \"general\"):\(.line // \"\") \(.body)\") | join(\"\n\")" <<< "$threads")"
            gh pr comment "$pr" --repo "$REPO" --body "$(printf '%s\n\n%s\n\n%s' \
              '@copilot Please address all unresolved Copilot code review findings below on this PR branch. Update tests and documentation as needed, run all tests, push the fix, and resolve the addressed threads. Do not merge.' \
              "$findings" "$marker")" >/dev/null
            echo "Handed off $count finding(s) to Copilot (round $((rounds + 1)) of $MAX_FIX_ROUNDS)"
            set_state "$issue" "$WORKING_LABEL"
          }
          pr="$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH"; exit 0; fi
          issue="$(resolve_issue "$pr" "$BRANCH")"
          if [ -z "$issue" ]; then echo "No Issue mapping for PR #$pr" >&2; exit 1; fi
          echo "PR #$pr -> Issue #$issue, SHA $SHA"
          request_copilot_review "$pr" "$SHA"
          set_state "$issue" "$AI_REVIEW_LABEL"
          rc=0; wait_for_review "$pr" "$SHA" || rc=$?
          if [ "$rc" -eq 0 ]; then process_review "$pr" "$issue" "$SHA"; fi

  process-ai-review:
    # Backup path, in case GitHub delivers the Copilot review event to Actions.
    if: >-
      github.event_name == 'pull_request_review' &&
      startsWith(github.event.review.user.login, 'copilot-pull-request-reviewer')
    runs-on: ubuntu-latest
    steps:
      - name: Process Copilot review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          resolve_issue() {
            # Order: PR body marker -> branch name -> Issue comment -> single active Issue.
            local pr="$1" branch="$2" body issue open_json candidate comments active
            body="$(gh pr view "$pr" --repo "$REPO" --json body --jq '.body // ""')"
            issue="$(printf '%s\n' "$body" | sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' | head -1)"
            if [ -z "$issue" ]; then
              issue="$(printf '%s\n' "$branch" | sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p')"
            fi
            open_json="$(gh issue list --repo "$REPO" --state open --limit 200 --json number,labels)"
            if [ -z "$issue" ]; then
              for candidate in $(jq -r --arg w "$WORKING_LABEL" --arg a "$AI_REVIEW_LABEL" --arg r "$REVIEW_LABEL" --arg b "$BLOCKED_LABEL" \
                  '.[] | select(any(.labels[]?.name; . == $w or . == $a or . == $r or . == $b)) | .number' <<< "$open_json"); do
                comments="$(gh issue view "$candidate" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
                if printf '%s\n' "$comments" | grep -Eq "agent-orchestrator:pr=${pr}([^0-9]|$)|Mapped automatically to PR #${pr}([^0-9]|$)"; then
                  issue="$candidate"; break
                fi
              done
            fi
            if [ -z "$issue" ]; then
              active="$(jq -r --arg w "$WORKING_LABEL" --arg a "$AI_REVIEW_LABEL" --arg r "$REVIEW_LABEL" \
                  '[.[] | select(any(.labels[]?.name; . == $w or . == $a or . == $r)) | .number] | if length == 1 then .[0] else empty end' <<< "$open_json")"
              if [ -n "$active" ]; then echo "Mapped PR #$pr to the only active Issue #$active" >&2; issue="$active"; fi
            fi
            if [ -n "$issue" ]; then
              if ! printf '%s\n' "$body" | grep -Fq "agent-orchestrator:issue=$issue"; then
                gh pr edit "$pr" --repo "$REPO" --body "$(printf '%s\n\n<!-- agent-orchestrator:issue=%s -->\nCloses #%s\n' "$body" "$issue" "$issue")" >/dev/null
              fi
              comments="$(gh issue view "$issue" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
              if ! printf '%s\n' "$comments" | grep -Eq "agent-orchestrator:pr=${pr}([^0-9]|$)"; then
                gh issue comment "$issue" --repo "$REPO" --body "$(printf '<!-- agent-orchestrator:pr=%s -->\nMapped automatically to PR #%s.' "$pr" "$pr")" >/dev/null
              fi
            fi
            printf '%s' "$issue"
          }

          set_state() {
            local issue="$1" target="$2" labels label
            labels="$(gh issue view "$issue" --repo "$REPO" --json labels --jq '.labels[]?.name // empty')"
            for label in "$READY_LABEL" "$WORKING_LABEL" "$AI_REVIEW_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
