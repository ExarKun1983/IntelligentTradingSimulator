name: Agent orchestrator v5.3.0

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/agent-orchestrator.yml, .github/scripts/agent-orchestrator.sh]
  issues:
    types: [labeled, closed]
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-orchestrator-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.event.issue.number || github.ref }}
  cancel-in-progress: false

env:
  READY_LABEL: agent:ready
  WORKING_LABEL: agent:working
  AI_REVIEW_LABEL: agent:ai-review
  REVIEW_LABEL: agent:review
  BLOCKED_LABEL: agent:blocked
  BASE_BRANCH: master
  COPILOT_REVIEWER: copilot-pull-request-reviewer[bot]
  MAX_FIX_ROUNDS: 3
  REVIEW_WAIT_SECONDS: 900
  POLL_SECONDS: 30
  LAUNCH_MATCH_WINDOW_SECONDS: 1800
  CI_WORKFLOW_FILE: ci.yml
# Jobs share resolver/state helpers from .github/scripts/agent-orchestrator.sh, always checked out from the
# default branch so every job runs identical mapping and state logic.

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$READY_LABEL" --repo "$REPO" --color 0E8A16 --description "Ready for Copilot" --force
          gh label create "$WORKING_LABEL" --repo "$REPO" --color FBCA04 --description "Copilot is implementing or fixing feedback" --force
          gh label create "$AI_REVIEW_LABEL" --repo "$REPO" --color 5319E7 --description "Waiting for Copilot code review" --force
          gh label create "$REVIEW_LABEL" --repo "$REPO" --color 1D76DB --description "Ready for human review" --force
          gh label create "$BLOCKED_LABEL" --repo "$REPO" --color D93F0B --description "Needs human attention" --force

  start-agent:
    if: >-
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'agent:ready' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Load orchestrator helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Validate and start task
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          source .github/scripts/agent-orchestrator.sh
          active="$(gh issue list --repo "$REPO" --state open --limit 200 --json number,labels)"
          count="$(jq --argjson issue "$ISSUE" --arg w "$WORKING_LABEL" --arg a "$AI_REVIEW_LABEL" --arg r "$REVIEW_LABEL" \
            '[.[] | select(.number != $issue) | select(any(.labels[]?.name; . == $w or . == $a or . == $r))] | length' <<< "$active")"
          if [ "$count" -ne 0 ]; then
            echo "Another Issue is active; finish or unblock it first." >&2
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$READY_LABEL" --add-label "$BLOCKED_LABEL"
            exit 1
          fi
          # A relaunch also clears a stale agent:blocked left by a previous closed-unmerged PR.
          set_state "$ISSUE" "$WORKING_LABEL"
          payload="$(jq -n --arg prompt "$(build_task_prompt "$ISSUE" "$TITLE" "$BODY" "$BASE_BRANCH")" --arg base "$BASE_BRANCH" \
            '{prompt: $prompt, base_ref: $base, create_pull_request: true}')"
          out="$(mktemp)"
          code="$(curl -sS -o "$out" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer $AGENT_TOKEN" \
            "https://api.github.com/agents/repos/$REPO/tasks" -d "$payload")"
          cat "$out"
          if [[ "$code" != 2* ]]; then
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$WORKING_LABEL" --add-label "$BLOCKED_LABEL"
            exit 1
          fi

  map-pr:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'opened' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Load orchestrator helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Persist Issue to PR mapping
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          source .github/scripts/agent-orchestrator.sh
          issue="$(resolve_issue "$PR" "$BRANCH")"
          if [ -z "$issue" ]; then echo "Could not map PR #$PR to an Issue" >&2; exit 1; fi
          echo "PR #$PR mapped to Issue #$issue"

  review-after-ci:
    # After green CI: request Copilot review, wait for it in this job, then hand off findings or promote.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'copilot/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Load orchestrator helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Request review, wait, process
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CI_CONFIRMED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          source .github/scripts/agent-orchestrator.sh
          pr="$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH"; exit 0; fi
          issue="$(resolve_issue "$pr" "$BRANCH")"
          if [ -z "$issue" ]; then echo "No Issue mapping for PR #$pr" >&2; exit 1; fi
          echo "PR #$pr -> Issue #$issue, SHA $SHA"
          request_copilot_review "$pr" "$SHA"
          set_state "$issue" "$AI_REVIEW_LABEL"
          rc=0; wait_for_review "$pr" "$SHA" || rc=$?
          if [ "$rc" -eq 0 ]; then process_review "$pr" "$issue" "$SHA"; fi

  ci-failure:
    # After failed, timed-out, or cancelled CI: never promote; hand the failure to Copilot or ask a human.
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["failure","timed_out","cancelled","startup_failure"]'), github.event.workflow_run.conclusion) &&
      startsWith(github.event.workflow_run.head_branch, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Load orchestrator helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Route CI failure
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          source .github/scripts/agent-orchestrator.sh
          pr="$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH"; exit 0; fi
          issue="$(resolve_issue "$pr" "$BRANCH")"
          if [ -z "$issue" ]; then echo "No Issue mapping for PR #$pr" >&2; exit 1; fi
          echo "PR #$pr -> Issue #$issue, SHA $SHA, CI $CONCLUSION"
          handle_ci_failure "$pr" "$issue" "$SHA" "$CONCLUSION" "$RUN_URL"

  process-ai-review:
    # Backup path, in case GitHub delivers the Copilot review event to Actions.
    if: >-
      github.event_name == 'pull_request_review' &&
      startsWith(github.event.review.user.login, 'copilot-pull-request-reviewer')
    runs-on: ubuntu-latest
    steps:
      - name: Load orchestrator helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Process Copilot review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source .github/scripts/agent-orchestrator.sh
          if [ "$REVIEW_SHA" != "$HEAD_SHA" ]; then echo "Stale review; ignoring"; exit 0; fi
          issue="$(resolve_issue "$PR" "$BRANCH")"
          if [ -z "$issue" ]; then echo "No Issue mapping for PR #$PR" >&2; exit 1; fi
          process_review "$PR" "$issue" "$HEAD_SHA"

  human-feedback:
    if: >-
      github.event.pull_request.state == 'open' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/') &&
      ((github.event_name == 'pull_request_review' && github.event.review.user.type != 'Bot' && github.event.review.state != 'approved') ||
       (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-latest
    steps:
      - name: Load orchestrator helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Hand off human feedback to Copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source .github/scripts/agent-orchestrator.sh
          issue="$(resolve_issue "$PR" "$BRANCH")"
          if [ -z "$issue" ]; then echo "No Issue mapping; nothing to do"; exit 0; fi
          marker="<!-- agent-orchestrator:human-handoff-sha=$HEAD_SHA -->"
          existing="$(gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
          if ! printf '%s\n' "$existing" | grep -Fq "$marker"; then
            gh pr comment "$PR" --repo "$REPO" --body "$(printf '%s\n\n%s' \
              '@copilot Please address all unresolved human review comments on this PR branch. Run all tests, push the fix, and resolve the addressed threads. Do not merge.' \
              "$marker")"
          fi
          set_state "$issue" "$WORKING_LABEL"

  terminal-state:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Load orchestrator helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Close or block mapped Issue
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
          CLOSED_AT: ${{ github.event.pull_request.closed_at }}
        run: |
          set -euo pipefail
          source .github/scripts/agent-orchestrator.sh
          issue="$(resolve_issue "$PR" "$BRANCH")"
          if [ -z "$issue" ]; then echo "No Issue mapping; nothing to do"; exit 0; fi
          if [ "$MERGED" = "true" ]; then
            set_state "$issue" ""
            gh issue close "$issue" --repo "$REPO" --reason completed
          elif issue_superseded "$issue" "$PR" "$CLOSED_AT"; then
            echo "Issue #$issue was relaunched or mapped to a newer PR; leaving its state unchanged"
          else
            set_state "$issue" "$BLOCKED_LABEL"
          fi

  reconcile-existing-pr:
    # Runs on push of this file or manual "Run workflow": repairs a PR stuck in agent:ai-review.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Load orchestrator helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Repair the single open Copilot PR
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .github/scripts/agent-orchestrator.sh
          prs="$(gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefName,headRefOid)"
          copilot_prs="$(jq -c '[.[] | select(.headRefName | startswith("copilot/"))]' <<< "$prs")"
          if [ "$(jq length <<< "$copilot_prs")" -ne 1 ]; then echo "Need exactly one open Copilot PR; no-op"; exit 0; fi
          pr="$(jq -r '.[0].number' <<< "$copilot_prs")"
          branch="$(jq -r '.[0].headRefName' <<< "$copilot_prs")"
          sha="$(jq -r '.[0].headRefOid' <<< "$copilot_prs")"
          issue="$(resolve_issue "$pr" "$branch")"
          if [ -z "$issue" ]; then echo "No Issue mapping for PR #$pr; no-op"; exit 0; fi
          echo "PR #$pr -> Issue #$issue, SHA $sha"
          request_copilot_review "$pr" "$sha"
          set_state "$issue" "$AI_REVIEW_LABEL"
          rc=0; wait_for_review "$pr" "$sha" || rc=$?
          if [ "$rc" -eq 0 ]; then process_review "$pr" "$issue" "$sha"; fi

  cleanup-closed-issue:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove state labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          labels="$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '.labels[]?.name // empty')"
          for label in "$READY_LABEL" "$WORKING_LABEL" "$AI_REVIEW_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
            if printf '%s\n' "$labels" | grep -Fxq "$label"; then
              gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$label"
            fi
          done
