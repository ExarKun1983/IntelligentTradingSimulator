            echo "Copilot review requested for PR #$pr"
          }
          issue="$(resolve_issue "$PR" "$BRANCH")"
          if [ -z "$issue" ]; then echo "No Issue mapping; nothing to do"; exit 0; fi
          marker="<!-- agent-orchestrator:human-handoff-sha=$HEAD_SHA -->"
          existing="$(gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[]?.body // empty')"
          if ! printf '%s\n' "$existing" | grep -Fq "$marker"; then
            gh pr comment "$PR" --repo "$REPO" --body "$(printf '%s\n\n%s' \
              '@copilot Please address all unresolved human review comments on this PR branch. Run all tests, push the fix, and resolve the addressed threads. Do not merge.' \
