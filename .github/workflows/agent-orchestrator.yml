name: Agent orchestrator

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/agent-orchestrator.yml]
  issues:
    types: [labeled, closed]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

env:
  READY_LABEL: agent:ready
  WORKING_LABEL: agent:working
  REVIEW_LABEL: agent:review
  BLOCKED_LABEL: agent:blocked
  BASE_BRANCH: master

jobs:
  bootstrap-labels:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$READY_LABEL" --repo "$REPOSITORY" --color 0E8A16 --description "Ready for Copilot" --force
          gh label create "$WORKING_LABEL" --repo "$REPOSITORY" --color FBCA04 --description "Copilot is working" --force
          gh label create "$REVIEW_LABEL" --repo "$REPOSITORY" --color 1D76DB --description "Ready for human review" --force
          gh label create "$BLOCKED_LABEL" --repo "$REPOSITORY" --color D93F0B --description "Needs human attention" --force

  start-agent:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent:ready' &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure only one active issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          other="$(gh issue list --repo "$REPOSITORY" --state open --label "$WORKING_LABEL" --limit 100 --json number --jq '.[].number' | awk -v n="$ISSUE_NUMBER" '$1 != n {c++} END {print c+0}')"
          test "$other" -eq 0 || { echo "Another issue is agent:working" >&2; exit 1; }

      - name: Set working state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$READY_LABEL" --add-label "$WORKING_LABEL"

      - name: Start Copilot task
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          test -n "${COPILOT_AGENT_TOKEN:-}" || { echo "Missing COPILOT_AGENT_TOKEN" >&2; exit 1; }
          payload="$(jq -n --arg n "$ISSUE_NUMBER" --arg t "$ISSUE_TITLE" --arg b "$ISSUE_BODY" --arg base "$BASE_BRANCH" \
            '{prompt:("Implement GitHub Issue #"+$n+": "+$t+"\n\n"+$b+"\n\nFollow .github/copilot-instructions.md. Keep changes focused. Run restore, build, and tests. Create a pull request against "+$base+". Include a standalone line: Closes #"+$n+". Do not merge."),base_ref:$base,create_pull_request:true}')"
          response="$(mktemp)"
          code="$(curl -sS -o "$response" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer $COPILOT_AGENT_TOKEN" \
            "https://api.github.com/agents/repos/$REPOSITORY/tasks" -d "$payload")"
          cat "$response"
          [[ "$code" == 2* ]] || { echo "Agent API HTTP $code" >&2; exit 1; }

      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$READY_LABEL" --remove-label "$WORKING_LABEL" --add-label "$BLOCKED_LABEL"

  map-issue-to-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Persist mapping in PR and Issue
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issues="$(gh issue list --repo "$REPOSITORY" --state open --label "$WORKING_LABEL" --limit 10 --json number)"
          test "$(jq length <<< "$issues")" -eq 1 || { echo "Expected exactly one agent:working issue" >&2; exit 1; }
          issue="$(jq -r '.[0].number' <<< "$issues")"
          body="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json body --jq '.body // ""')"
          marker="<!-- agent-orchestrator:issue=$issue -->"
          if ! grep -Fq "$marker" <<< "$body"; then
            gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --body "$(printf '%s\n\n%s\nCloses #%s\n' "$body" "$marker" "$issue")"
          fi
          gh issue comment "$issue" --repo "$REPOSITORY" --body "<!-- agent-orchestrator:pr=$PR_NUMBER -->
          Mapped automatically to PR #$PR_NUMBER."

  promote-after-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Promote Copilot PR and set review state
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$HEAD_BRANCH" == copilot/* ]] || { echo "Not a Copilot branch: $HEAD_BRANCH"; exit 0; }
          pr="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --limit 1 --json number,isDraft,body | jq -c '.[0] // empty')"
          [ -n "$pr" ] || { echo "No open PR"; exit 0; }
          number="$(jq -r .number <<< "$pr")"
          body="$(jq -r '.body // ""' <<< "$pr")"
          issue="$(sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' <<< "$body" | head -1)"
          if [ -z "$issue" ]; then
            issue="$(gh issue list --repo "$REPOSITORY" --state open --label "$WORKING_LABEL" --limit 2 --json number --jq 'if length == 1 then .[0].number else empty end')"
          fi
          [ -n "$issue" ] || { echo "No unambiguous issue mapping; no-op"; exit 0; }
          if [ "$(jq -r .isDraft <<< "$pr")" = true ]; then gh pr ready "$number" --repo "$REPOSITORY"; fi
          gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$READY_LABEL" --remove-label "$WORKING_LABEL" --remove-label "$BLOCKED_LABEL" --add-label "$REVIEW_LABEL"

  synchronize-pr-state:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve mapping and synchronize state
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json body --jq '.body // ""')"
          issue="$(sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' <<< "$body" | head -1)"

          # v4.4 fallback: resolve PR -> Issue from the persistent Issue comment.
          if [ -z "$issue" ]; then
            candidates="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number,labels)"
            while IFS= read -r candidate; do
              [ -z "$candidate" ] && continue
              comments="$(gh issue view "$candidate" --repo "$REPOSITORY" --json comments --jq '.comments[].body')"
              if grep -Eq "agent-orchestrator:pr=${PR_NUMBER}([^0-9]|$)|Mapped automatically to PR #${PR_NUMBER}([^0-9]|$)" <<< "$comments"; then
                issue="$candidate"
                break
              fi
            done < <(jq -r --arg working "$WORKING_LABEL" --arg review "$REVIEW_LABEL" --arg blocked "$BLOCKED_LABEL" '
              .[] | select((.labels | map(.name)) as $n |
                (($n | index($working)) != null) or
                (($n | index($review)) != null) or
                (($n | index($blocked)) != null)) | .number
            ' <<< "$candidates")
          fi

          [ -n "$issue" ] || { echo "No mapped Issue for PR #$PR_NUMBER; no-op"; exit 0; }

          labels="$(gh issue view "$issue" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          for label in "$READY_LABEL" "$WORKING_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
            if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$label"; fi
          done

          if [ "$PR_MERGED" = true ]; then
            gh issue close "$issue" --repo "$REPOSITORY" --reason completed
          elif [ "$PR_ACTION" = closed ]; then
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$BLOCKED_LABEL"
          elif [ "$PR_DRAFT" = false ]; then
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$REVIEW_LABEL"
          else
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$WORKING_LABEL"
          fi

  reconcile-mapped-issues:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Repair stale Issue states from Issue comments
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          issues="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number,labels)"
          jq -r --arg working "$WORKING_LABEL" --arg review "$REVIEW_LABEL" --arg blocked "$BLOCKED_LABEL" '
            .[] | select((.labels | map(.name)) as $n |
              (($n | index($working)) != null) or
              (($n | index($review)) != null) or
              (($n | index($blocked)) != null)) | .number
          ' <<< "$issues" |
          while IFS= read -r issue; do
            [ -z "$issue" ] && continue
            comments="$(gh issue view "$issue" --repo "$REPOSITORY" --json comments --jq '.comments[].body')"
            pr="$(sed -nE -e 's/.*agent-orchestrator:pr=([0-9]+).*/\1/p' -e 's/.*Mapped automatically to PR #([0-9]+).*/\1/p' <<< "$comments" | tail -1)"
            [ -n "$pr" ] || continue
            data="$(gh pr view "$pr" --repo "$REPOSITORY" --json state,isDraft,mergedAt 2>/dev/null || true)"
            [ -n "$data" ] || continue
            labels="$(gh issue view "$issue" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
            for label in "$READY_LABEL" "$WORKING_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
              if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$label"; fi
            done
            if [ -n "$(jq -r '.mergedAt // empty' <<< "$data")" ]; then
              gh issue close "$issue" --repo "$REPOSITORY" --reason completed
            elif [ "$(jq -r .state <<< "$data")" = CLOSED ]; then
              gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$BLOCKED_LABEL"
            elif [ "$(jq -r .isDraft <<< "$data")" = false ]; then
              gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$REVIEW_LABEL"
            else
              gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$WORKING_LABEL"
            fi
          done

  cleanup-closed-issue:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove agent labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          labels="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          for label in "$READY_LABEL" "$WORKING_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
            if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$label"; fi
          done
