name: Agent orchestrator

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/agent-orchestrator.yml]
  issues:
    types: [labeled, closed]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

env:
  READY_LABEL: agent:ready
  WORKING_LABEL: agent:working
  AI_REVIEW_LABEL: agent:ai-review
  REVIEW_LABEL: agent:review
  BLOCKED_LABEL: agent:blocked
  BASE_BRANCH: master
  COPILOT_REVIEWER: copilot-pull-request-reviewer[bot]

jobs:
  bootstrap-labels:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$READY_LABEL" --repo "$REPOSITORY" --color 0E8A16 --description "Ready for Copilot" --force
          gh label create "$WORKING_LABEL" --repo "$REPOSITORY" --color FBCA04 --description "Copilot is working" --force
          gh label create "$AI_REVIEW_LABEL" --repo "$REPOSITORY" --color 5319E7 --description "Waiting for Copilot code review" --force
          gh label create "$REVIEW_LABEL" --repo "$REPOSITORY" --color 1D76DB --description "Ready for human review" --force
          gh label create "$BLOCKED_LABEL" --repo "$REPOSITORY" --color D93F0B --description "Needs human attention" --force

  start-agent:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent:ready' &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure only one Issue is active
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          active="$(gh issue list --repo "$REPOSITORY" --state open --limit 100 --json number,labels)"
          other="$(jq -r --argjson n "$ISSUE_NUMBER" --arg working "$WORKING_LABEL" --arg ai "$AI_REVIEW_LABEL" --arg review "$REVIEW_LABEL" '
            [.[] | select(.number != $n) | select((.labels | map(.name)) as $l |
              (($l|index($working))!=null) or (($l|index($ai))!=null) or (($l|index($review))!=null))] | length' <<< "$active")"
          test "$other" -eq 0 || { echo "Another Issue is already active" >&2; exit 1; }

      - name: Set working state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$READY_LABEL" --add-label "$WORKING_LABEL"

      - name: Start Copilot task
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          test -n "${COPILOT_AGENT_TOKEN:-}" || { echo "Missing COPILOT_AGENT_TOKEN" >&2; exit 1; }
          payload="$(jq -n --arg n "$ISSUE_NUMBER" --arg t "$ISSUE_TITLE" --arg b "$ISSUE_BODY" --arg base "$BASE_BRANCH" \
            '{prompt:("Implement GitHub Issue #"+$n+": "+$t+"\n\n"+$b+"\n\nFollow .github/copilot-instructions.md. Keep changes focused. Run restore, build, and tests. Create a pull request against "+$base+". Include a standalone line: Closes #"+$n+". Do not merge."),base_ref:$base,create_pull_request:true}')"
          response="$(mktemp)"
          code="$(curl -sS -o "$response" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer $COPILOT_AGENT_TOKEN" \
            "https://api.github.com/agents/repos/$REPOSITORY/tasks" -d "$payload")"
          cat "$response"
          [[ "$code" == 2* ]] || { echo "Agent API HTTP $code" >&2; exit 1; }

      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$READY_LABEL" --remove-label "$WORKING_LABEL" --add-label "$BLOCKED_LABEL"

  map-issue-to-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Persist Issue to PR mapping
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          issue="$(sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p' <<< "$HEAD_BRANCH")"
          if [ -z "$issue" ]; then
            issues="$(gh issue list --repo "$REPOSITORY" --state open --label "$WORKING_LABEL" --limit 10 --json number)"
            test "$(jq length <<< "$issues")" -eq 1 || { echo "Expected exactly one agent:working Issue" >&2; exit 1; }
            issue="$(jq -r '.[0].number' <<< "$issues")"
          fi
          body="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json body --jq '.body // ""')"
          marker="<!-- agent-orchestrator:issue=$issue -->"
          if ! grep -Fq "$marker" <<< "$body"; then
            gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --body "$(printf '%s\n\n%s\nCloses #%s\n' "$body" "$marker" "$issue")"
          fi
          comments="$(gh issue view "$issue" --repo "$REPOSITORY" --json comments --jq '.comments[].body')"
          if ! grep -Eq "agent-orchestrator:pr=${PR_NUMBER}([^0-9]|$)" <<< "$comments"; then
            gh issue comment "$issue" --repo "$REPOSITORY" --body "<!-- agent-orchestrator:pr=$PR_NUMBER -->
          Mapped automatically to PR #$PR_NUMBER."
          fi

  request-copilot-review-after-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Request or re-request Copilot review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_BRANCH" == copilot/* ]] || { echo "Not a Copilot branch: $HEAD_BRANCH"; exit 0; }
          pr="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --limit 1 --json number,body | jq -c '.[0] // empty')"
          [ -n "$pr" ] || { echo "No open Copilot PR"; exit 0; }
          number="$(jq -r .number <<< "$pr")"
          body="$(jq -r '.body // ""' <<< "$pr")"

          issue="$(sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' <<< "$body" | head -1)"
          if [ -z "$issue" ]; then
            candidates="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number,labels)"
            while IFS= read -r candidate; do
              [ -z "$candidate" ] && continue
              comments="$(gh issue view "$candidate" --repo "$REPOSITORY" --json comments --jq '.comments[].body')"
              if grep -Eq "agent-orchestrator:pr=${number}([^0-9]|$)|Mapped automatically to PR #${number}([^0-9]|$)" <<< "$comments"; then issue="$candidate"; break; fi
            done < <(jq -r --arg working "$WORKING_LABEL" --arg ai "$AI_REVIEW_LABEL" --arg review "$REVIEW_LABEL" --arg blocked "$BLOCKED_LABEL" '
              .[] | select((.labels|map(.name)) as $n | (($n|index($working))!=null) or (($n|index($ai))!=null) or (($n|index($review))!=null) or (($n|index($blocked))!=null)) | .number' <<< "$candidates")
          fi
          if [ -z "$issue" ]; then
            issue="$(sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p' <<< "$HEAD_BRANCH")"
          fi
          [ -n "$issue" ] || { echo "No Issue mapping for PR #$number" >&2; exit 1; }

          reviews="$(gh api --paginate "repos/$REPOSITORY/pulls/$number/reviews" --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]" or .user.login == "copilot-pull-request-reviewer") | [.id,.commit_id] | @tsv')"
          if awk -v sha="$HEAD_SHA" '$2 == sha {found=1} END {exit !found}' <<< "$reviews"; then
            echo "Copilot already reviewed current SHA $HEAD_SHA; no-op"
            exit 0
          fi

          requested="$(gh api "repos/$REPOSITORY/pulls/$number/requested_reviewers" --jq '.users[].login')"
          if grep -Fxq "$COPILOT_REVIEWER" <<< "$requested"; then
            echo "Copilot review is already pending; no-op"
          elif grep -Eq '^copilot-pull-request-reviewer(\[bot\])?$' <<< "$(cut -f1 <<< "$reviews")"; then
            gh api --method POST "repos/$REPOSITORY/pulls/$number/requested_reviewers/rerequest" -f "reviewers[]=$COPILOT_REVIEWER"
          else
            gh api --method POST "repos/$REPOSITORY/pulls/$number/requested_reviewers" -f "reviewers[]=$COPILOT_REVIEWER"
          fi

          labels="$(gh issue view "$issue" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          for label in "$READY_LABEL" "$WORKING_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
            if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$label"; fi
          done
          if ! grep -Fxq "$AI_REVIEW_LABEL" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$AI_REVIEW_LABEL"; fi

  complete-copilot-review:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      (github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' || github.event.review.user.login == 'copilot-pull-request-reviewer')
    runs-on: ubuntu-latest
    steps:
      - name: Promote PR after current Copilot review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [ "$REVIEW_COMMIT" = "$HEAD_SHA" ] || { echo "Review is stale; no-op"; exit 0; }
          body="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json body --jq '.body // ""')"
          issue="$(sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' <<< "$body" | head -1)"
          if [ -z "$issue" ]; then
            candidates="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number,labels)"
            while IFS= read -r candidate; do
              [ -z "$candidate" ] && continue
              comments="$(gh issue view "$candidate" --repo "$REPOSITORY" --json comments --jq '.comments[].body')"
              if grep -Eq "agent-orchestrator:pr=${PR_NUMBER}([^0-9]|$)|Mapped automatically to PR #${PR_NUMBER}([^0-9]|$)" <<< "$comments"; then issue="$candidate"; break; fi
            done < <(jq -r --arg working "$WORKING_LABEL" --arg ai "$AI_REVIEW_LABEL" --arg review "$REVIEW_LABEL" '
              .[] | select((.labels|map(.name)) as $n | (($n|index($working))!=null) or (($n|index($ai))!=null) or (($n|index($review))!=null)) | .number' <<< "$candidates")
          fi
          [ -n "$issue" ] || issue="$(sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p' <<< "$HEAD_BRANCH")"
          [ -n "$issue" ] || { echo "No Issue mapping" >&2; exit 1; }

          unresolved="$(gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:20){nodes{author{login}}}}}}}}' \
            -F owner="${REPOSITORY%%/*}" -F repo="${REPOSITORY#*/}" -F number="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false) | select(any(.comments.nodes[]; .author.login == "copilot-pull-request-reviewer" or .author.login == "copilot-pull-request-reviewer[bot]"))] | length')"
          labels="$(gh issue view "$issue" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          if grep -Fxq "$AI_REVIEW_LABEL" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$AI_REVIEW_LABEL"; fi
          if [ "$unresolved" -gt 0 ]; then
            if ! grep -Fxq "$WORKING_LABEL" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$WORKING_LABEL"; fi
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Copilot code review found $unresolved unresolved thread(s). Address the review feedback on this PR. After fixes are pushed and CI passes, v5.1 will request Copilot re-review."
          else
            gh pr ready "$PR_NUMBER" --repo "$REPOSITORY" 2>/dev/null || true
            if grep -Fxq "$WORKING_LABEL" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$WORKING_LABEL"; fi
            if ! grep -Fxq "$REVIEW_LABEL" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$REVIEW_LABEL"; fi
          fi

  human-review-feedback:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.review.user.type != 'Bot' &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Return PR to agent after human review feedback
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_STATE: ${{ github.event.review.state }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "${REVIEW_STATE,,}" in changes_requested|commented) ;; *) echo "No change request"; exit 0;; esac
          body="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json body --jq '.body // ""')"
          issue="$(sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' <<< "$body" | head -1)"
          if [ -z "$issue" ]; then
            issues="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number)"
            while IFS= read -r candidate; do
              comments="$(gh issue view "$candidate" --repo "$REPOSITORY" --json comments --jq '.comments[].body')"
              if grep -Eq "agent-orchestrator:pr=${PR_NUMBER}([^0-9]|$)|Mapped automatically to PR #${PR_NUMBER}([^0-9]|$)" <<< "$comments"; then issue="$candidate"; break; fi
            done < <(jq -r '.[].number' <<< "$issues")
          fi
          [ -n "$issue" ] || issue="$(sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p' <<< "$HEAD_BRANCH")"
          [ -n "$issue" ] || exit 0
          labels="$(gh issue view "$issue" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          for label in "$AI_REVIEW_LABEL" "$REVIEW_LABEL"; do
            if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$label"; fi
          done
          if ! grep -Fxq "$WORKING_LABEL" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$WORKING_LABEL"; fi
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Human review feedback was submitted. Address the review comments on this PR. After fixes are pushed and CI passes, v5.1 will request Copilot code re-review."

  human-line-comment-feedback:
    if: >-
      github.event_name == 'pull_request_review_comment' &&
      github.event.action == 'created' &&
      github.event.comment.user.type != 'Bot' &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Return PR to agent after human line comment
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json body --jq '.body // ""')"
          issue="$(sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' <<< "$body" | head -1)"
          if [ -z "$issue" ]; then
            issues="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number)"
            while IFS= read -r candidate; do
              comments="$(gh issue view "$candidate" --repo "$REPOSITORY" --json comments --jq '.comments[].body')"
              if grep -Eq "agent-orchestrator:pr=${PR_NUMBER}([^0-9]|$)|Mapped automatically to PR #${PR_NUMBER}([^0-9]|$)" <<< "$comments"; then issue="$candidate"; break; fi
            done < <(jq -r '.[].number' <<< "$issues")
          fi
          [ -n "$issue" ] || issue="$(sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p' <<< "$HEAD_BRANCH")"
          [ -n "$issue" ] || exit 0
          labels="$(gh issue view "$issue" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          for label in "$AI_REVIEW_LABEL" "$REVIEW_LABEL"; do
            if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$label"; fi
          done
          if ! grep -Fxq "$WORKING_LABEL" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$WORKING_LABEL"; fi
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "A human line-level review comment was added. Address the feedback. CI and Copilot code review will run again after the fix is pushed."

  synchronize-pr-state:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize terminal state with comment fallback
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json body --jq '.body // ""')"
          issue="$(sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' <<< "$body" | head -1)"
          if [ -z "$issue" ]; then
            candidates="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number,labels)"
            while IFS= read -r candidate; do
              comments="$(gh issue view "$candidate" --repo "$REPOSITORY" --json comments --jq '.comments[].body')"
              if grep -Eq "agent-orchestrator:pr=${PR_NUMBER}([^0-9]|$)|Mapped automatically to PR #${PR_NUMBER}([^0-9]|$)" <<< "$comments"; then issue="$candidate"; break; fi
            done < <(jq -r '.[].number' <<< "$candidates")
          fi
          [ -n "$issue" ] || issue="$(sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p' <<< "$HEAD_BRANCH")"
          [ -n "$issue" ] || { echo "No mapped Issue; no-op"; exit 0; }
          labels="$(gh issue view "$issue" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          if [ "$PR_MERGED" = true ]; then
            for label in "$READY_LABEL" "$WORKING_LABEL" "$AI_REVIEW_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
              if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$label"; fi
            done
            gh issue close "$issue" --repo "$REPOSITORY" --reason completed
          elif [ "$PR_ACTION" = closed ]; then
            for label in "$READY_LABEL" "$WORKING_LABEL" "$AI_REVIEW_LABEL" "$REVIEW_LABEL"; do
              if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$label"; fi
            done
            if ! grep -Fxq "$BLOCKED_LABEL" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$BLOCKED_LABEL"; fi
          fi

  reconcile-active-pr:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Request review for existing active Copilot PR
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "$REPOSITORY" --state open --limit 100 --json number,headRefName,headRefOid,body | jq -c '[.[] | select(.headRefName | startswith("copilot/"))]')"
          [ "$(jq length <<< "$prs")" -le 1 ] || { echo "More than one open Copilot PR; no-op"; exit 0; }
          pr="$(jq -c '.[0] // empty' <<< "$prs")"
          [ -n "$pr" ] || { echo "No open Copilot PR"; exit 0; }
          number="$(jq -r .number <<< "$pr")"
          sha="$(jq -r .headRefOid <<< "$pr")"
          branch="$(jq -r .headRefName <<< "$pr")"
          body="$(jq -r '.body // ""' <<< "$pr")"
          issue="$(sed -nE 's/.*agent-orchestrator:issue=([0-9]+).*/\1/p' <<< "$body" | head -1)"
          if [ -z "$issue" ]; then
            issues="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number)"
            while IFS= read -r candidate; do
              comments="$(gh issue view "$candidate" --repo "$REPOSITORY" --json comments --jq '.comments[].body')"
              if grep -Eq "agent-orchestrator:pr=${number}([^0-9]|$)|Mapped automatically to PR #${number}([^0-9]|$)" <<< "$comments"; then issue="$candidate"; break; fi
            done < <(jq -r '.[].number' <<< "$issues")
          fi
          [ -n "$issue" ] || issue="$(sed -nE 's#^copilot/issue-([0-9]+)-.*#\1#p' <<< "$branch")"
          [ -n "$issue" ] || { echo "No mapping for PR #$number"; exit 0; }
          reviews="$(gh api --paginate "repos/$REPOSITORY/pulls/$number/reviews" --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]" or .user.login == "copilot-pull-request-reviewer") | [.id,.commit_id] | @tsv')"
          if awk -v sha="$sha" '$2 == sha {found=1} END {exit !found}' <<< "$reviews"; then echo "Current SHA already reviewed"; exit 0; fi
          requested="$(gh api "repos/$REPOSITORY/pulls/$number/requested_reviewers" --jq '.users[].login')"
          if ! grep -Fxq "$COPILOT_REVIEWER" <<< "$requested"; then
            if [ -n "$reviews" ]; then
              gh api --method POST "repos/$REPOSITORY/pulls/$number/requested_reviewers/rerequest" -f "reviewers[]=$COPILOT_REVIEWER"
            else
              gh api --method POST "repos/$REPOSITORY/pulls/$number/requested_reviewers" -f "reviewers[]=$COPILOT_REVIEWER"
            fi
          fi
          labels="$(gh issue view "$issue" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          for label in "$READY_LABEL" "$WORKING_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
            if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --remove-label "$label"; fi
          done
          if ! grep -Fxq "$AI_REVIEW_LABEL" <<< "$labels"; then gh issue edit "$issue" --repo "$REPOSITORY" --add-label "$AI_REVIEW_LABEL"; fi

  cleanup-closed-issue:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove agent labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          labels="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"
          for label in "$READY_LABEL" "$WORKING_LABEL" "$AI_REVIEW_LABEL" "$REVIEW_LABEL" "$BLOCKED_LABEL"; do
            if grep -Fxq "$label" <<< "$labels"; then gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --remove-label "$label"; fi
          done
