name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE: IntelligentTradingSimulator.sln
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  managed-route:
    name: Read canonical CI routing
    if: >-
      ${{ vars.ORCHESTRATION_MANAGED_ROUTING_APPROVED == 'true' &&
          vars.ORCHESTRATION_ACTIVATION_APPROVED == 'true' &&
          vars.ORCHESTRATION_REQUIRED_CONTEXT_VERIFIED == 'true' &&
          vars.ORCHESTRATION_NO_ADDED_CHARGES_VERIFIED == 'true' &&
          github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run_full_ci: ${{ steps.decide.outputs.run_full_ci }}
    steps:
      - name: Require explicitly reviewed routing code
        env:
          DEFINITION_SHA: ${{ vars.ORCHESTRATION_DEFINITION_SHA }}
        run: |
          [[ "$DEFINITION_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout trusted routing definition only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ vars.ORCHESTRATION_DEFINITION_SHA }}
          persist-credentials: false
      - name: Setup .NET SDK for trusted router
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Read canonical state and independently verify current PR head
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORCHESTRATION_MANAGED_ROUTING_APPROVED: ${{ vars.ORCHESTRATION_MANAGED_ROUTING_APPROVED }}
          ORCHESTRATION_ACTIVATION_APPROVED: ${{ vars.ORCHESTRATION_ACTIVATION_APPROVED }}
          ORCHESTRATION_REQUIRED_CONTEXT_VERIFIED: ${{ vars.ORCHESTRATION_REQUIRED_CONTEXT_VERIFIED }}
          ORCHESTRATION_NO_ADDED_CHARGES_VERIFIED: ${{ vars.ORCHESTRATION_NO_ADDED_CHARGES_VERIFIED }}
          ORCHESTRATION_DEFINITION_SHA: ${{ vars.ORCHESTRATION_DEFINITION_SHA }}
        run: >-
          dotnet run --project IntelligentTradingSimulator.Orchestration
          --configuration Release --
          --github-route --dry-run

  build-and-test:
    name: Build and test
    needs: managed-route
    # Disabled routing preserves ordinary CI. Enabled routing must succeed and explicitly allow CI.
    if: ${{ always() && !cancelled() && (needs.managed-route.result == 'skipped' || needs.managed-route.result == 'success' && needs.managed-route.outputs.run_full_ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test agent orchestrator scripts
        run: bash .github/scripts/tests/agent-orchestrator.test.sh

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_FILE"

      - name: Build solution
        run: dotnet build "$SOLUTION_FILE" --configuration Release --no-restore

      - name: Run tests
        run: >-
          dotnet test "$SOLUTION_FILE"
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
          retention-days: 14
